'use strict';
const $=s=>document.querySelector(s),app=$('#app'),modal=$('#modal');
const missions=[
 {name:'輪椅上學實境',time:'早上 07:50',icon:'🧑‍🦽',who:'小宇',body:'我使用手動輪椅。今天要經過狹窄走廊、坡道和教室門口。請留意我的輪子、腳踏板，以及能不能靠近並碰到按鈕。',how:'按住雙輪前推可直行；單推一側會彎向另一側。卡住時先倒退再轉向。坡上鬆手會後移，要用煞車停穩。門口先試按高處開關，再請人開啟低位按鈕，自己開門。可隨時回本段起點練習。',goal:'完成走廊、坡道、門口３段任務。',win:'抵達座位！上學這段路，你完成了。',insight:'能不能通過，不只看眼前有沒有路，也與轉身空間、坡面、按鈕位置和門扇有關。先問同學需要什麼協助，再一起改善環境。',badge:'路線開拓者',seconds:180},
 {name:'看清楚再行動',time:'上午 09:10',icon:'🔎',who:'小晴',body:'相似的字、反光和小標示，會讓我需要花更多時間核對。',how:'完成課桌、資料架、座位３段任務。按住拖動逐格查看，停穩後按拿取或確認。放大鏡只放大目前這一格，遮板可以減少反光；每段找齊３個完整標示相符的目標。',goal:'完成３段精細辨認任務',win:'三段資訊都核對清楚了！',insight:'放大與清楚標示能減少辨認的負擔，資訊相似或有反光時，仍需要時間核對。',badge:'細節偵探',seconds:150},
 {name:'無聲球場挑戰',time:'上午 10:30',icon:'🏐',who:'小安',body:'除了球的位置，我也需要看得到隊友要我接球還是讓開。',how:'共３段，每段完成４次正確反應。🙌要移到白球跑道，在黃框內按「現在接球」；✋要移到其他跑道讓開。最後球路會改變，橘球是干擾。可開啟文字訊號，也能重試本段。',goal:'看懂訊號、掌握時機，完成３段球場任務',win:'三段球場合作完成！',insight:'視覺訊號要說清楚動作、方向與變更，而不只是告訴大家有事情發生。',badge:'默契接球手',seconds:150},
 {name:'午餐任務切換',time:'中午 12:00',icon:'🍱',who:'小禾',body:'做到一半被打斷或訂單改了，我需要重新確認：哪些做好了，接下來做什麼。',how:'按順序取餐並核對送餐，共３段。第二段中途改單，第三段要先完成同學的小任務，再回到原本步驟。錯拿可以退回最後一項；固定步驟卡可重看最新訂單。',goal:'取餐、改單、被打斷後接續，完成３段任務',win:'你處理了三種午餐任務！',insight:'留下已完成與下一步的線索，能幫助人在任務變更、被打斷後繼續操作。',badge:'步驟高手',seconds:180}

let done=[false,false,false,false],current=-1,game=null,raf=0,last=0,paused=false,finished=false,remaining=0,elapsed=0,toastUntil=0,extended=false,cleanups=[],soundOn=false,audioCtx;
const rand=(a,b)=>a+Math.random()*(b-a);const pick=a=>a[Math.floor(Math.random()*a.length)];

function beep(good=true){if(!soundOn||current===2)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=good?650:230;g.gain.setValueAtTime(.045,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.14);o.start();o.stop(audioCtx.currentTime+.15)}catch{}}

function home(){dispose();current=-1;app.innerHTML=`<section class="home"><div class="home-top"><div class="eyebrow">四位同學・四種玩法・一場校園冒險</div><h1>今天上學，<br><em>換你闖關！</em></h1><p>走廊、教室、球場、餐廳。<br>加入四位同學的任務，把卡住的地方變成過得去的路。</p><div class="cast" aria-hidden="true"><span>🧑‍🦽</span><span>🔎</span><span>🏐</span><span>🍱</span></div></div><div class="home-body"><div class="callout"><span style="font-size:35px">🎒</span><div><b>放學前，集齊４枚徽章</b><div class="small muted">已完成 ${done.filter(Boolean).length}／４關・不用填寫答案</div></div></div><button id="start" class="primary full">${done.every(Boolean)?'再挑一關，繼續挑戰':'出發！開始闖關 →'}</button><div class="mission-list">${missions.map((m,i)=>`<button class="mission-tile" data-level="${i}"><span class="emoji">${m.icon}</span><strong>${i+1}. ${m.name}</strong><small>${m.time}・${m.who}</small>${done[i]?'<span class="check">✓</span>':''}</button>`).join('')}</div><div class="row"><button id="sound" class="ghost">音效：${soundOn?'開':'關'}</button>${done.every(Boolean)?'<button id="results" class="mint">我的４枚徽章</button>':''}</div><p class="fine">這是幾種校園情境的遊戲化體會，不能代表所有身障同學的生活。每個人需要的方法都不一樣。<br>平板直向玩・無須登入・進度只留在本次畫面</p></div></section>`;$('#start').onclick=()=>intro(Math.max(0,done.findIndex(x=>!x)));document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>intro(+b.dataset.level));$('#sound').onclick=()=>{soundOn=!soundOn;beep();home()};if($('#results'))$('#results').onclick=ending;window.scrollTo(0,0)}
function dialog(html){paused=true;if(game?.release)game.release();app.inert=true;modal.innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${html}</section></div>`;modal.querySelector('button')?.focus()}

function findGame(){let phase=0,items=[],focus=-1,held=null,zoom=false,shade=false,settle=0,taken=0,blocked=false;const required=[['國語・上冊','鉛筆・２Ｂ','膠水・白蓋'],['作業・第３組','藍夾・自然','講義・今天'],['第２排・Ｂ座','第３排・Ｄ座','第４排・Ａ座']];const others=[['國語・下冊','數學・上冊','鉛筆・ＨＢ','鉛筆・Ｂ２','膠水・藍蓋','洗手乳・白蓋','國語・習作','紅筆・２Ｂ','直尺・２０','膠水・黃蓋','數學・下冊','蠟筆・２Ｂ','剪刀・藍柄','原子筆・黑','自然・上冊','聯絡簿','美勞・材料'],['作業・第８組','作業・第Ｂ組','藍夾・社會','綠夾・自然','講義・昨天','講義・明天','作業・第２組','作業・第５組','紅夾・自然','藍夾・國語','作業・第６組','藍夾・數學','講義・上週','作業・第９組','綠夾・社會','紅夾・國語','備用紙'],['第２排・８座','第２排・Ｄ座','第３排・Ｂ座','第３排・Ｃ座','第４排・４座','第４排・Ｄ座','第１排・Ａ座','第１排・Ｂ座','第１排・Ｃ座','第１排・Ｄ座','第２排・Ａ座','第２排・Ｃ座','第３排・Ａ座','第４排・Ｂ座','第４排・Ｃ座','第５排・Ａ座','第５排・Ｂ座']];const names=['課桌細節辨認','反光資料架','教室座位尋找'];
 const play=$('#play');play.classList.add('advanced-find');$('#controls').innerHTML='<div class="row"><button id="take-item" class="primary" disabled>拿取選中物品</button><button id="zoom" class="mint">加大放大鏡</button></div><div class="row" style="margin-top:9px"><button id="shade" class="ghost">調整反光遮板</button><button id="reset-find" class="ghost">重試本段</button></div><p class="legend">按住拖動逐格查看，停穩後按「拿取」。放大鏡只看清目前這一格。</p>';
 function build(){focus=-1;held=null;settle=0;taken=0;blocked=false;items=shuffle([...required[phase].map(label=>({label,target:true})),...others[phase].map(label=>({label,target:false}))]);play.innerHTML=`<div class="precision-grid">${items.map((o,i)=>`<button class="precision-cell" data-item="${i}" aria-label="查看第${i+1}格"><span>${phase===2?'🪑':phase===1?'📁':o.label.includes('剪刀')?'✂️':o.label.includes('直尺')?'📏':o.label.includes('筆')?'✏️':o.label.includes('膠')||o.label.includes('洗')?'🧴':'📕'}</span><small>${o.label}</small></button>`).join('')}</div><div class="glare" id="glare"></div>`;$('#extra').innerHTML=`<div class="task-tags">${required[phase].map(s=>`<span data-need="${s}">${s}</span>`).join('')}</div><div class="focus-read" id="focus-read">先選一格，停穩後查看標示。</div>`;$('.mission').textContent=`${phase+1}／３ ${names[phase]}：找齊下方指定的３個目標。`;stat(phase,3,'路段');$('#take-item').disabled=true;$('#take-item').textContent=phase===2?'確認這個座位':'拿取選中物品';document.querySelectorAll('[data-item]').forEach(b=>{b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(+b.dataset.item)}}});say('相似物品很多，要讀清楚完整標示。')}

 function locate(e){const r=play.getBoundingClientRect(),xx=(e.clientX-r.left)/r.width,yy=(e.clientY-r.top)/r.height;return xx<0||xx>=1||yy<0||yy>=1?-1:Math.floor(yy*5)*4+Math.floor(xx*4)}

 $('#zoom').onclick=()=>{zoom=!zoom;$('#zoom').classList.toggle('tool-active',zoom);document.querySelectorAll('[data-item]').forEach(b=>b.classList.toggle('bigger',zoom));say(zoom?'目前這一格的文字變大了，其餘仍需要逐格查看。':'回到原本放大倍率。')};$('#shade').onclick=()=>{shade=!shade;$('#shade').classList.toggle('tool-active',shade);say(shade?'遮板擋住了反光，但仍要辨認相似標示。':'遮板收起。')};$('#reset-find').onclick=build;build();return{release(){held=null},update(dt){if(blocked)return;if(focus>=0){settle+=dt;if(settle>=.4){$('#focus-read').textContent='🔎 '+items[focus].label;$('#take-item').disabled=!!items[focus].got}}$('#glare').style.opacity=phase===0||shade?'0':String(.35+.2*Math.sin(elapsed*.65));$('#glare').style.transform=`translateX(${Math.sin(elapsed*.35)*28}%)`;}}}
function ballGame(){const {ctx,canvas}=makeCanvas();let phase=0,success=0,lane=1,px=360,lights=false,trial=null,wait=.8,locked=false,effect=0;const centers=[145,360,575],names=['看懂接球訊號','接住或讓開','追蹤改變的球路'];stat(0,3,'路段');$('#controls').innerHTML='<div class="lane-buttons"><button data-lane="0">← 左邊</button><button data-lane="1" class="active">中間</button><button data-lane="2">右邊 →</button></div><button id="catch-now" class="primary full" style="margin-top:10px">🙌 現在接球</button><div class="row" style="margin-top:9px"><button id="captions" class="mint">開啟文字訊號</button><button id="retry-ball" class="ghost">重試本段</button></div><p class="legend">🙌＝移到球下方，在黃框內按接球。<br>✋＝離開球的跑道，讓球落下。本關完全無聲。</p>';

 return {update(dt){if(locked)return;px+=(centers[lane]-px)*Math.min(1,dt*16);effect*=Math.max(0,1-dt*3);if(!trial||trial.resolved){wait-=dt;if(wait<=0)spawn();return}trial.age+=dt;if(trial.age<trial.preview)return;trial.y+=dt*(phase===0?183:phase===1?220:250);if(phase===2&&trial.y>270&&!trial.changed){trial.oldLane=trial.lane;trial.lane=(trial.lane+1)%3;trial.changed=true;say('球路改變了！留意新的方向。')}trial.x+=(centers[trial.lane]-trial.x)*Math.min(1,dt*8);if(trial.y>572){if(trial.kind==='avoid')result(lane!==trial.lane,lane!==trial.lane?'讓開成功！你看懂了不同的訊號。':'這次要讓開白色球的跑道，再試一次。');else result(false,'錯過接球時機。這球重來，前面的進度保留。')}},draw(){ctx.fillStyle='#dce9ff';ctx.fillRect(0,0,720,640);for(let i=0;i<3;i++){round(ctx,45+i*215,158,200,437,18,i===lane?'#b9edd8':'#f2f5ff');ctx.strokeStyle='#a8b6c9';ctx.setLineDash([12,15]);ctx.beginPath();ctx.moveTo(centers[i],190);ctx.lineTo(centers[i],590);ctx.stroke();ctx.setLineDash([])}round(ctx,40,448,640,124,12,'#ffd55366');text(ctx,'接球時機區',595,461,16);round(ctx,20,14,680,131,18,'#17334c');if(trial&&!trial.resolved){const dir=['← 左','↓ 中','右 →'][trial.lane];text(ctx,trial.kind==='catch'?'🙌':'✋',180,65,48);text(ctx,dir,390,62,36,'#ffd553');text(ctx,lights?(trial.kind==='catch'?'接住白色球':'讓開白色球'):'看手勢，再決定動作',360,117,24,'white');text(ctx,'🏐',trial.x,trial.y,52);if(phase===2){text(ctx,'🟠',centers[(trial.lane+1)%3],Math.min(600,trial.y+65),43)}}else text(ctx,'下一球準備中',360,78,31,'white');text(ctx,'🙌',px,596,55);if(Math.abs(effect)>.1)text(ctx,effect>0?'✓':'再試一次',360,350,48,effect>0?'#0e756b':'#b75030');}}
}
function lunchGame(){const {ctx,canvas}=makeCanvas();let phase=0,step=0,order=[],items=[],spawn=0,next=0,tray=[],pinned=false,slow=false,shownUntil=0,chatOpen=false,interrupted=false,changed=false,ready=false,locked=false,returning=false;const food=['🍚','🥦','🥕','🍗','🍎'];const names=['三步驟取餐','中途更改訂單','中斷後回到原步驟'];
 $('#play').insertAdjacentHTML('beforeend','<div class="order-card" id="order-card"><small id="order-title"></small><div class="order-icons" id="order-icons"></div></div>');$('#controls').innerHTML='<div class="belt-controls"><button id="grab" class="primary">✋ 拿取</button><button id="pin" class="mint">📌 固定步驟卡</button></div><div class="row" style="margin-top:9px"><button id="serve" class="dark">✅ 核對並送餐</button><button id="slow" class="ghost">慢速輸送</button></div><div class="row" style="margin-top:9px"><button id="undo" class="ghost">退回最後一項</button><button id="retry-lunch" class="ghost">重試本段</button></div><p class="legend">看清順序，在食物進入中央框時拿取。<br>裝滿後還要核對送餐；錯拿可以退回，不必全部重來。</p>';
 function card(){const full=pinned||elapsed<shownUntil;$('#order-icons').innerHTML=order.map((f,i)=>`<span style="opacity:${i<step?.4:1}">${f}</span>`).join(' → ');$('#order-icons').style.visibility=full?'visible':'hidden';$('#order-title').textContent=full?`第${phase+1}份・${changed?'已更新訂單・':''}已放${step}／${order.length}項`:'步驟收起了；可以固定卡片再查看。';$('#serve').disabled=!ready;}

 function interruption(){interrupted=true;chatOpen=true;returning=false;const change=phase===1;$('#play').insertAdjacentHTML('beforeend',`<div class="class-chat" id="lunch-chat"><b>${change?'🧑‍🍳 訂單更新：第三項青菜改成胡蘿蔔，其他不變。':'🧒 同學：可以先幫我把湯匙和水杯放回去嗎？'}</b><div class="row">${change?'<button id="ack-order">記住了，更新訂單</button>':'<button id="put-spoon">🥄 放回湯匙</button><button id="put-cup" disabled>🥤 放回水杯</button>'}</div></div>`);

 function grab(){if(paused||locked||chatOpen||ready)return;const hit=items.filter(i=>Math.abs(i.x-360)<57).sort((a,b)=>Math.abs(a.x-360)-Math.abs(b.x-360))[0];if(!hit){say('還沒進入取餐框，再等一下。',false);return}tray.push(hit.food);step++;items=items.filter(i=>i!==hit);say('已放第'+step+'項。'+(pinned?'可以對照步驟卡核對。':''));if(step===2&&phase>0&&!interrupted)interruption();ready=step===order.length;card();}
 $('#grab').onclick=grab;listen(canvas,'pointerdown',e=>{if(pos(e,canvas).y>220)grab()});listen(document,'keydown',e=>{if(e.code==='Space'&&!modal.firstChild){e.preventDefault();grab()}});$('#pin').onclick=()=>{pinned=!pinned;$('#pin').classList.toggle('tool-active',pinned);card();say(pinned?'步驟卡固定了，記得核對更新後的內容。':'步驟卡收起。')};$('#slow').onclick=()=>{slow=!slow;$('#slow').classList.toggle('tool-active',slow)};$('#undo').onclick=()=>{if(chatOpen||locked||!step)return;step--;tray.pop();ready=false;card();say('退回最後一項，前面的餐點保留。')};$('#retry-lunch').onclick=setup;$('#serve').onclick=()=>{if(paused||locked||chatOpen||!ready)return;let mismatch=tray.findIndex((x,i)=>x!==order[i]);if(mismatch>=0){say(`第${mismatch+1}項與目前訂單不同。退回後面幾項，重新拿取。`,false);pinned=true;$('#pin').classList.add('tool-active');card();return}locked=true;if(phase===2){win();return}nextSegment(names[phase]+'完成！',phase===0?'下一份訂單會在你做到一半時更改。留意哪些步驟保留、哪一項變了。':'下一段會被同學打斷。幫忙之後，要接回自己原本做到的地方。',()=>{phase++;setup()})};setup();
